m2w64_c_stdlib:
  - if: win and x86_64
    then: m2w64-sysroot
m2w64_c_stdlib_version:
  - if: win and x86_64
    then: "12"

c_compiler:
  - if: win and x86_64
    then:
      - vs
      - gcc
  - if: win and arm64
    then: zig
cxx_compiler:
  # gcc lane takes C++ from m2w64_cxx; compiler("cxx") is only used with vs
  - if: win and x86_64
    then: vs
  - if: win and arm64
    then: zig
# no gcc 15 cross toolchain for s390x yet
c_compiler_version:
  - if: linux and s390x
    then: "14"
cxx_compiler_version:
  - if: linux and s390x
    then: "14"

ocaml_compiler_version:
  - 5.5.2

channel_sources:
  - conda-forge/label/ocaml_vs,conda-forge

# Uploads from this branch go to the ocaml_vs label, not main.
channel_targets:
  - conda-forge ocaml_vs
